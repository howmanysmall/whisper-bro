[package]
name = "yap"
version = "2.0.1"
edition = "2024"
rust-version = "1.98"
description = "Shortcut-driven voice typing for Windows and macOS: record, transcribe through OpenRouter, paste."
readme = "README.md"
homepage = "https://github.com/howmanysmall/yap"
repository = "https://github.com/howmanysmall/yap"
license = "MIT"
keywords = ["dictation", "openrouter", "speech-to-text", "voice-typing", "whisper"]
categories = ["accessibility", "multimedia::audio"]
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
directories = "6"
hound = "3.5"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = {
	version = "0.3",
	default-features = false,
	features = ["AVCaptureDevice", "AVMediaFormat", "block2", "std"]
}
objc2-foundation = "0.3"
objc2-quartz-core = {
	version = "0.3",
	default-features = false,
	features = ["CALayer", "objc2-core-foundation", "std"]
}

[target.'cfg(target_os = "windows")'.dependencies]
windows = {
	version = "0.62",
	features = [
		"Win32_Foundation",
		"Win32_Graphics_Gdi",
		"Win32_Media_Audio",
		"Win32_Security",
		"Win32_System_Com",
		"Win32_System_Console",
		"Win32_System_DataExchange",
		"Win32_System_Diagnostics_Debug",
		"Win32_System_LibraryLoader",
		"Win32_System_Memory",
		"Win32_System_Ole",
		"Win32_System_Registry",
		"Win32_System_Threading",
		"Win32_UI_Accessibility",
		"Win32_UI_Input_KeyboardAndMouse",
		"Win32_UI_Shell",
		"Win32_UI_WindowsAndMessaging",
	]
}

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
