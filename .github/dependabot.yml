version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Gives a bad release time to be yanked before it lands here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # One PR for every compatible update, separate PRs for major versions.
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
