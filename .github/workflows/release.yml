name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, such as v0.1.0"
        required: true
        type: string

permissions: {}

# Runs for the same tag queue instead of racing on one release. The "-caller"
# part keeps this group distinct from check.yml's, which sees this workflow's
# name too.
concurrency:
  group: ${{ github.workflow }}-caller-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  # Runs alongside `check`, so the model call doesn't add to the release time.
  notes:
    name: Release notes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      notes: ${{ steps.generate.outputs.notes }}
    steps:
      - name: Validate the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Expected a release tag like v0.1.0, got '$TAG'"
            exit 1
          fi

      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # communique needs the previous tag and the commits since it.
          fetch-depth: 0
          persist-credentials: false

      - name: Match the tag against Cargo.toml
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi

      - name: Install communique
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: communique
          # A tag-triggered release must not restore a cache it could be
          # poisoned through.
          cache: false

      # An empty output makes `publish` fall back to GitHub's generated notes.
      - id: generate
        name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Names the previous tag when communique's auto-detection is wrong,
          # e.g. to skip a broken release. Empty means auto-detect.
          RELEASE_BASELINE: ${{ vars.RELEASE_BASELINE }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          echo "Release baseline: ${RELEASE_BASELINE:-auto}"
          if communique generate "$TAG" ${RELEASE_BASELINE:+"$RELEASE_BASELINE"} \
            --output "$notes" --review-report release-notes-review.md; then
            delimiter="notes-$(openssl rand -hex 16)"
            {
              echo "notes<<$delimiter"
              cat "$notes"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=communique failed::Falling back to GitHub's generated release notes."
          fi

      - name: Upload release notes coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-review
          path: release-notes-review.md
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: [check, notes]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ needs.notes.outputs.notes }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # Leaves out the release notes coverage report.
          pattern: whisper-bro-*
          merge-multiple: true

      - name: Checksum the packages
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      - name: Publish the GitHub release
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
            notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            notes=(--generate-notes)
          fi
          flags=(--verify-tag --title "Whisper Bro $TAG" "${notes[@]}")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A previous attempt created the release; finish uploading to it.
            gh release upload "$TAG" dist/* --clobber
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --draft=false --notes-file "$RUNNER_TEMP/release-notes.md"
            else
              gh release edit "$TAG" --draft=false
            fi
          else
            # Uploads every asset before the release becomes visible.
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
