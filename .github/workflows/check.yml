name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Ref to check out. Empty means the ref that triggered the run.
        type: string
        default: ""
      release:
        description: Whether this run gates a release, which must not use build caches.
        type: boolean
        default: false

permissions: {}

# A new push to a pull request cancels its older runs. Pushes to main and
# releases run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only help local rebuilds; in CI they slow builds and
  # bloat the cache.
  CARGO_INCREMENTAL: "0"
  # Debug info is the largest part of a test build and nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: short
  # mise.toml routes cargo through mbx, whose local cache starts empty on every
  # runner. Swatinem/rust-cache restores target/ instead.
  MBX_DISABLE: "1"

jobs:
  # Everything that doesn't compile the crate, on one fast Linux runner:
  # formatting, Markdown, TOML, shell, workflows, TypeScript, secrets, and
  # cargo-deny's advisory, license, and source checks. The crate only builds for
  # macOS and Windows, so Clippy runs in `test` instead.
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # commitlint and betterleaks read the full history.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: >-
            betterleaks cargo-deny hk jactionlint mr-boxington node pinact pkl pnpm rumdl rust
            shellcheck shfmt tombi
          cache: ${{ github.ref_type != 'tag' && !inputs.release }}

      # The history scan needs no Node packages, so it runs during the install.
      - id: install-packages
        name: Install packages
        run: pnpm install --frozen-lockfile
        background: true

      - name: Scan history for secrets
        run: betterleaks git --config .betterleaks.toml --redact --no-banner

      - name: Wait for packages
        wait: install-packages

      - parallel:
          - name: hk checks
            env:
              GH_TOKEN: ${{ github.token }}
            # betterleaks only scans staged changes here; the history scan
            # above covers it.
            run: hk check --all --no-fail-fast --skip-step cargo-clippy --skip-step betterleaks

          - name: Lint commit messages
            if: github.event_name == 'pull_request'
            env:
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            run: node --run commitlint -- --strict --from "$BASE_SHA" --to "$HEAD_SHA"

  test:
    name: Test (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ github.ref_type != 'tag' && !inputs.release }}
          target: ${{ matrix.target }}
          cache-key: test

      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  # Runs alongside `test` rather than after it, so a green run takes as long as
  # the slowest job instead of the sum of them.
  package:
    name: Package (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app: both architectures are built on Apple Silicon,
          # which is faster than an Intel runner.
          - name: macOS
            os: macos-15
            target: "aarch64-apple-darwin x86_64-apple-darwin"
            artifact: yap-macos-universal
          - name: Windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: yap-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ github.ref_type != 'tag' && !inputs.release }}
          target: ${{ matrix.target }}
          cache-key: package

      - if: runner.os == 'macOS'
        run: mise run package:macos-universal

      - if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes

      # The macOS row builds its own targets, so only Windows sets this.
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: mise run package:windows

      # release.yml downloads every artifact of the run into dist/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error

  # One status to require in branch protection, so adding or renaming a job
  # doesn't mean editing the rules.
  ci:
    name: CI
    if: always()
    needs: [lint, test, package]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
