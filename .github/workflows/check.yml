name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise run check
      - run: mise run build
      - if: runner.os == 'macOS'
        run: mise run package:macos
      - if: runner.os == 'Windows'
        shell: pwsh
        run: mise run package:windows
      - uses: actions/upload-artifact@v7
        with:
          name: whisper-bro-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15
    env:
      CARGO_BUILD_TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: mise run package:macos
      - uses: actions/upload-artifact@v7
        with:
          name: whisper-bro-x86_64-apple-darwin
          path: dist/*.zip
          if-no-files-found: error
