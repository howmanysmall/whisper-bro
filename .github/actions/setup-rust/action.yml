name: Set up Rust
description: Install the Rust toolchain pinned in mise.toml for one target, and restore its build cache.

inputs:
  target:
    description: Rust target triples to build for, space-separated, such as aarch64-apple-darwin.
    required: true
  cache-key:
    description: Names this job's build cache, so jobs that build differently don't share one.
    required: true
  cache:
    description: Whether to restore and save build caches, as "true" or "false".
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        # mise.toml enables mr_boxington on rust, which requires mbx installed.
        install_args: rust mr-boxington
        cache: ${{ inputs.cache == 'true' && github.ref_type != 'tag' }}

    # A no-op for the runner's own target; needed to cross-compile.
    - shell: bash
      env:
        TARGETS: ${{ inputs.target }}
      run: |
        for target in $TARGETS; do
          rustup target add "$target"
        done

    - id: cache-suffix
      shell: bash
      env:
        TARGETS: ${{ inputs.target }}
      run: echo "value=${TARGETS// /-}" >> "$GITHUB_OUTPUT"

    # Releases build from scratch rather than from a cache a pull request could
    # have written.
    - if: inputs.cache == 'true' && github.ref_type != 'tag'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}-${{ steps.cache-suffix.outputs.value }}
        # Pull requests read main's cache but never write their own, so they
        # can't evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
