[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin", "target/debug"]

HK_MISE = 1

[settings]
experimental = true
auto_install = false
lockfile = true
provenance_api_failures_fatal = false
cargo.binstall_native = true

[tools]
betterleaks = "latest"
cargo-deny = "latest"
communique = { version = "latest", workflow = "release.yml@refs/heads/main" }
hk = { version = "2.7.0", workflow = "release.yml" }
jactionlint = "latest"
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main" }
ni = { version = "latest", auto_update = true }
node = "26"
pinact = "latest"
pkl = "latest"
pnpm = "12.14.0"
rumdl = "latest"
rust = { version = "1.98.1", components = ["rustfmt", "clippy"], mr_boxington = true }
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
vale = "latest"

[tasks.build]
description = "Build the release binary"
run = "cargo build --locked --release"

[tasks.dev]
description = "Run the background dictation utility"
run = "cargo run --locked -- run"

[tasks.test]
description = "Run unit and local protocol integration tests"
run = "cargo test --locked --all-targets"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.check]
description = "Check formatting, lint, and test in sequence"
run = [
	"cargo fmt --all -- --check",
	"cargo clippy --locked --all-targets -- -D warnings",
	"cargo test --locked --all-targets",
]

[tasks."build:universal"]
description = "Build the release binary for Apple Silicon and Intel"
run = "cargo build --locked --release --target aarch64-apple-darwin --target x86_64-apple-darwin"

[tasks."package:macos"]
description = "Build a macOS app bundle and zip"
depends = ["build"]
run = "bash scripts/package-macos.sh"

[tasks."package:macos-universal"]
description = "Build a universal macOS app bundle and zip"
depends = ["build:universal"]
run = "YAP_UNIVERSAL=1 bash scripts/package-macos.sh"

[tasks."package:windows"]
description = "Build the Windows portable zip and installer (installer requires Inno Setup 6)"
depends = ["build"]
run = [
	"powershell -NoProfile -File scripts/package-windows.ps1",
	"powershell -NoProfile -File scripts/package-windows-installer.ps1",
]

[tasks."package:windows-portable"]
description = "Build a portable Windows zip"
depends = ["build"]
run = "powershell -NoProfile -File scripts/package-windows.ps1"

[tasks.release]
description = "Check, then bump, commit, tag, and push a release via bumpp so GitHub Actions publishes it. Pass patch, minor, major, or an explicit version; with no argument bumpp prompts for one."
usage = 'arg "[level]" help="patch, minor, major, or an explicit X.Y.Z"'
run = [
	"mise run check",
	'node --run release -- ${usage_level:+--release "$usage_level"}',
]

[tasks.amend]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff --no-verify"

[tasks."amend:verify"]
description = "Amends the staged changes, reusing the previous commit message, and runs the Git hooks."
run = "git commit --amend --reuse-message=HEAD --signoff"

[tasks.commit]
description = "Commits the staged changes."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}"
"""

[tasks."commit:no-verify"]
description = "Commits the staged changes without running Git hooks."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}" --no-verify
"""
