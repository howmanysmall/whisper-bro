[tools]
rust = { version = "1.98.1", components = ["rustfmt", "clippy"] }

[tasks.build]
description = "Build the release binary"
run = "cargo build --locked --release"

[tasks.dev]
description = "Run the background dictation utility"
run = "cargo run --locked -- run"

[tasks.test]
description = "Run unit and local protocol integration tests"
run = "cargo test --locked --all-targets"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.check]
description = "Check formatting, lint, and test in sequence"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked --all-targets",
]

[tasks."package:macos"]
description = "Build a macOS app bundle and zip"
depends = ["build"]
run = "bash scripts/package-macos.sh"

[tasks."package:windows"]
description = "Build the Windows portable zip and installer (installer requires Inno Setup 6)"
depends = ["build"]
run = [
  "powershell -NoProfile -File scripts/package-windows.ps1",
  "powershell -NoProfile -File scripts/package-windows-installer.ps1",
]

[tasks."package:windows-portable"]
description = "Build a portable Windows zip"
depends = ["build"]
run = "powershell -NoProfile -File scripts/package-windows.ps1"

[tasks.release]
description = "Check, tag, and push a release so GitHub Actions publishes it. Pass patch, minor, major, or an explicit version; with no argument it releases the version already in Cargo.toml."
usage = 'arg "[level]" default="release" help="patch, minor, major, release, or an explicit X.Y.Z"'
tools = { "github:crate-ci/cargo-release" = "1.1.6" }
run = [
  "mise run check",
  "cargo release --execute {{usage.level}}",
]

[tasks."release:dry-run"]
description = "Preview a release without committing, tagging, or pushing (same argument as release)"
usage = 'arg "[level]" default="release" help="patch, minor, major, release, or an explicit X.Y.Z"'
tools = { "github:crate-ci/cargo-release" = "1.1.6" }
run = "cargo release {{usage.level}}"
